name: Build Docker Image
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.MY_PERSONAL_ACCESS_TOKEN }}
    - name: Build the Docker image
      run: docker build . -f Dockerfile -t ghcr.io/n1ccc/cors-anywhere-unraid/cors-unraid-proxy:latest 
    - name: List docker images
      run: docker images
    - name: Push Docker Image
      run: docker push ghcr.io/n1ccc/cors-anywhere-unraid/cors-unraid-proxy:latest 
