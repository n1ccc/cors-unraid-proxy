name: Build Docker Image
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.n1ccc }}
    - name: Build the Docker image
      run: docker build . -f Dockerfile -t ghcr.io/n1ccc/cors-unraid-proxy/cors-unraid-proxy-docker:latest 
    - name: List docker images
      run: docker images
    - name: Run Docker
      run: docker run ghcr.io/n1ccc/cors-unraid-proxy/cors-unraid-proxy-docker:latest 
    - name: Push Docker Image
      run: docker push ghcr.io/n1ccc/cors-unraid-proxy/cors-unraid-proxy:latest 
