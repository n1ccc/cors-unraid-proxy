server {
  listen 80;
  server_name localhost;

  location ~ /reverseproxy/(.*) {
        # Extrahiert die Ziel-URL nach /reverseproxy/
        set $target_url $1;

        # Setzt CORS-Header, falls die Backends sie nicht setzen / Only GET
        add_header 'Access-Control-Allow-Origin' '*';

        # Dynamische Weiterleitung an die extrahierte URL
        proxy_pass http://$target_url;
  }
}