server {
  listen 80;
  server_name localhost;

  location ~ /reverseproxy/(.*) {
        # Extract the destination URL from the request
        set $target_url $1;

        # Set the CORS header if the backend does not provide it
        add_header 'Access-Control-Allow-Origin' '*';

        # Redirect requests to the extracted destination URL
        proxy_pass http://$target_url;
  }
}
